<!DOCTYPE html>
<html>
<head>
    <title>View Resume</title>
    <style>
        body { margin: 0; padding: 0; }
        embed { 
            width: 100%; 
            height: 100vh; 
            border: none;
        }
    </style>
    <link rel="stylesheet" href="assets/css/pageloader.css" />
</head>
<body>
    <!-- Page Loader -->
    <div id="pageLoader">
        <div class="ai-matrix-loader">
            <div class="digit">0</div>
            <div class="digit">1</div>
            <div class="digit">0</div>
            <div class="digit">1</div>
            <div class="digit">1</div>
            <div class="digit">0</div>
            <div class="digit">0</div>
            <div class="digit">1</div>
            <div class="glow"></div>
        </div>

        <div class="boot-text" id="bootText">
            <span id="bootingText"></span><span class="cursor">|</span>
        </div>
    </div>

    <embed src="resume.pdf#toolbar=0&navpanes=0" type="application/pdf">

        <script src="assets/js/pageloader.js"></script>
</body>
</html>
